  "janeiro", "fevereiro", "março", "abril", "maio", "junho",
  "julho", "agosto", "setembro", "outubro", "novembro", "dezembro",
];

const brl = (n) =>
  Math.abs(n).toLocaleString("pt-BR", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2,
  });

const dataLonga = (iso) => {
  const [a, m, d] = iso.split("-");
  return `${d} de ${MESES[Number(m) - 1]} de ${a}`;
};

const dataCurta = (iso) => {
  const [a, m, d] = iso.split("-");
  return `${d}/${m}/${a}`;
};

const diasEntre = (isoA, isoB) =>
  Math.round((new Date(isoA) - new Date(isoB)) / 86400000);

function Icone({ nome, tam = 24, cor = "currentColor", larg = 1.5, className = "" }) {
  const d = P[nome];
  if (!d) return null;
  return (
    <svg
      className={className}
      width={tam}
      height={tam}
      viewBox="0 0 24 24"
      fill="none"
      stroke={cor}
      strokeWidth={larg}
      strokeLinecap="round"
      strokeLinejoin="round"
      aria-hidden="true"
    >
      {d.split("|").map((p, i) => (
        <path key={i} d={p} />
      ))}
    </svg>
  );
}

/* ------------------------------------------------------------------ */
/*  Peças de interface                                                 */
/* ------------------------------------------------------------------ */

function Valor({ n, oculto, sinal, classe = "" }) {
  if (oculto) return <span className={"b-oculto " + classe} aria-label="valor oculto" />;
  const s = sinal === "saida" ? "- " : sinal === "entrada" ? "+ " : "";
  return <span className={classe}>{s}R$ {brl(n)}</span>;
}

function Cabecalho({ titulo, aoVoltar, direita }) {
  return (
    <div className="b-topo">
      {aoVoltar ? (
        <button className="b-icone-btn" onClick={aoVoltar} aria-label="Voltar">
          <Icone nome="voltar" tam={22} />
        </button>
      ) : (
        <span className="b-topo-vazio" />
      )}
      <h1 className="b-topo-titulo">{titulo}</h1>
      <div className="b-topo-dir">{direita}</div>
    </div>
  );
}

function iconeDoKind(kind) {
  if (kind.startsWith("Pix enviado") || kind === "Pix agendado") return "troca";
  if (kind.startsWith("Pix recebido") || kind === "Salário") return "entrada";
  if (kind.startsWith("Compra")) return "sacola";
  if (kind.startsWith("Fatura")) return "cartao";
  if (kind.startsWith("Empréstimo")) return "combina";
  if (kind.startsWith("Guardado") || kind.startsWith("Resgate")) return "cofre";
  return "boleto";
}

function Linha({ t, oculto, aoAbrir }) {
  return (
    <button className="b-lanc" onClick={aoAbrir ? () => aoAbrir(t) : undefined}>
      <span className={"b-lanc-ic " + (t.tipo === "entrada" ? "b-verde" : "")}>
        <Icone nome={iconeDoKind(t.kind)} tam={22} larg={1.4} />
      </span>
      <span className="b-lanc-txt">
        <span className="b-lanc-kind">{t.kind}</span>
        <span className="b-lanc-nome">{t.nome}</span>
        <span className={"b-lanc-val " + (t.tipo === "entrada" ? "b-verde-txt" : "")}>
          <Valor n={t.valor} oculto={oculto} sinal={t.tipo} />
        </span>
      </span>
      {aoAbrir && <Icone nome="seta" tam={18} larg={1.4} className="b-lanc-seta" />}
    </button>
  );
}

function Filtro({ rotulo, opcoes, valor, aoMudar }) {
  const [aberto, setAberto] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    const fora = (e) => {
      if (ref.current && !ref.current.contains(e.target)) setAberto(false);
    };
    document.addEventListener("mousedown", fora);
    return () => document.removeEventListener("mousedown", fora);
  }, []);
  const atual = opcoes.find((o) => o.v === valor);
  return (
    <div className="b-filtro-wrap" ref={ref}>
      <button
        className={"b-chip " + (aberto ? "b-chip-on" : "")}
        onClick={() => setAberto((a) => !a)}
        aria-expanded={aberto}
      >
        {atual ? atual.r : rotulo}
        <Icone nome="baixo" tam={16} larg={1.6} />
      </button>
      {aberto && (
        <div className="b-pop" role="listbox">
          {opcoes.map((o) => (
            <button
              key={o.v}
              className={"b-pop-item " + (o.v === valor ? "b-pop-item-on" : "")}
              onClick={() => {
                aoMudar(o.v);
                setAberto(false);
              }}
            >
              {o.r}
              {o.v === valor && <Icone nome="check" tam={16} larg={2} />}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

function Teclado({ onDigito, onApagar }) {
  const teclas = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "", "0", "del"];
  return (
    <div className="b-teclado">
      {teclas.map((t, i) =>
        t === "" ? (
          <span key={i} />
        ) : t === "del" ? (
          <button key={i} className="b-tecla" onClick={onApagar} aria-label="Apagar">
            <Icone nome="apagar" tam={24} larg={1.4} />
          </button>
        ) : (
          <button key={i} className="b-tecla" onClick={() => onDigito(t)}>
            {t}
          </button>
        )
      )}
    </div>
  );
}

/* ------------------------------------------------------------------ */
/*  App                                                                */
/* ------------------------------------------------------------------ */

function App() {
  const [tela, setTela] = useState("extrato");
  const [oculto, setOculto] = useState(false);
  const [saldo, setSaldo] = useState(SALDO_INICIAL);
  const [lancs, setLancs] = useState(LANCAMENTOS);
  const [aba, setAba] = useState("recentes");
  const [periodo, setPeriodo] = useState(90);
  const [fluxo, setFluxo] = useState("todos");
  const [ordem, setOrdem] = useState("recentes");
  const [busca, setBusca] = useState(null);
  const [toast, setToast] = useState(null);
  const [recibo, setRecibo] = useState(null);
  const [ajuda, setAjuda] = useState(false);
  const [opiniao, setOpiniao] = useState(true);

  const [cofres, setCofres] = useState([
    { id: "p1", nome: "Reserva de emergência", saldo: 0, meta: 5000, cor: "#26268F" },
    { id: "p2", nome: "Viagem a Noronha", saldo: 0, meta: 2500, cor: "#EC7000" },
  ]);

  useEffect(() => {
    if (!toast) return;
    const id = setTimeout(() => setToast(null), 2600);
    return () => clearTimeout(id);
  }, [toast]);

  const avisar = (t) => setToast(t);

  const registrar = (t) => {
    setLancs((l) => [{ ...t, id: "n" + Date.now() + Math.random() }, ...l]);
    setSaldo((s) => (t.tipo === "entrada" ? s + t.valor : s - t.valor));
  };

  /* saldo de cada dia, sempre a partir da lista completa */
  const saldosPorDia = useMemo(() => {
    const dias = [...new Set(lancs.map((t) => t.data))].sort((a, b) => b.localeCompare(a));
    const mapa = {};
    let corrente = saldo;
    for (const d of dias) {
      mapa[d] = corrente;
      const liquido = lancs
        .filter((t) => t.data === d)
        .reduce((acc, t) => acc + (t.tipo === "entrada" ? t.valor : -t.valor), 0);
      corrente = corrente - liquido;
    }
    return mapa;
  }, [lancs, saldo]);

  const grupos = useMemo(() => {
    let lista = lancs.filter(
      (t) => t.data >= INICIO && diasEntre(HOJE, t.data) <= periodo
    );
    if (fluxo !== "todos") lista = lista.filter((t) => t.tipo === fluxo);
    if (busca && busca.trim()) {
      const q = busca.toLowerCase();
      lista = lista.filter(
        (t) => t.nome.toLowerCase().includes(q) || t.kind.toLowerCase().includes(q)
      );
    }
    const dias = [...new Set(lista.map((t) => t.data))].sort((a, b) =>
      ordem === "recentes" ? b.localeCompare(a) : a.localeCompare(b)
    );
    return dias.map((d) => ({
      data: d,
      saldoDia: saldosPorDia[d],
      itens: lista.filter((t) => t.data === d),
    }));
  }, [lancs, periodo, fluxo, ordem, busca, saldosPorDia]);

  const gruposFuturos = useMemo(() => {
    const dias = [...new Set(FUTUROS.map((t) => t.data))].sort();
    return dias.map((d) => ({ data: d, itens: FUTUROS.filter((t) => t.data === d) }));
  }, []);

  const guardado = cofres.reduce((a, c) => a + c.saldo, 0);

  const props = {
    oculto, saldo, setSaldo, lancs, registrar, avisar, setTela, setRecibo,
    cofres, setCofres, guardado,
  };

  return (
    <div className="b-fundo">
      <style>{CSS}</style>
      <div className="b-tela">
      <div className="b-topo-espaco" />

        {tela === "extrato" && (
          <Extrato
            {...props}
            aba={aba} setAba={setAba}
            periodo={periodo} setPeriodo={setPeriodo}
            fluxo={fluxo} setFluxo={setFluxo}
            ordem={ordem} setOrdem={setOrdem}
            busca={busca} setBusca={setBusca}
            grupos={grupos} gruposFuturos={gruposFuturos}
            setOculto={setOculto} setAjuda={setAjuda}
            opiniao={opiniao} setOpiniao={setOpiniao}
          />
        )}
        {tela === "pix" && <Pix {...props} />}
        {tela === "cartoes" && <Cartoes {...props} />}
        {tela === "combina" && <Combina {...props} />}
        {tela === "gastos" && <Gastos {...props} />}
        {tela === "comprovantes" && <Comprovantes {...props} />}
        {tela === "cofrinhos" && <Cofrinhos {...props} />}

        {recibo && <Recibo t={recibo} oculto={oculto} aoFechar={() => setRecibo(null)} avisar={avisar} />}
        {ajuda && (
          <div className="b-modal" onClick={() => setAjuda(false)}>
            <div className="b-folha" onClick={(e) => e.stopPropagation()}>
              <h2 className="b-folha-tit">Sobre este app</h2>
              <p className="b-folha-txt">
                Protótipo de conta digital. Os saldos, lançamentos e transferências
                existem só aqui dentro: nada é enviado a um banco de verdade.
              </p>
              <button className="b-btn" onClick={() => setAjuda(false)}>Entendi</button>
            </div>
          </div>
        )}
        {toast && <div className="b-toast">{toast}</div>}
      </div>
    </div>
  );
}

/*  Extrato                                                            */
/* ------------------------------------------------------------------ */

function Extrato({
  oculto, setOculto, saldo, guardado, grupos, gruposFuturos, aba, setAba,
  periodo, setPeriodo, fluxo, setFluxo, ordem, setOrdem, busca, setBusca,
  setTela, setRecibo, setAjuda, avisar, opiniao, setOpiniao,
}) {
  const atalhos = [
    { ic: "pix", r1: "Pix e", r2: "transferir", ir: "pix" },
    { ic: "cartao", r1: "Cartões", r2: "", ir: "cartoes" },

function Pix({ setTela, saldo, oculto, registrar, avisar, setRecibo }) {
  const [passo, setPasso] = useState("quem");
  const [destino, setDestino] = useState(null);
  const [chave, setChave] = useState("");
  const [digitos, setDigitos] = useState("");
  const [erro, setErro] = useState("");

  const valor = Number(digitos || 0) / 100;

  const voltar = () => {
    if (passo === "quem") setTela("extrato");
    else if (passo === "valor") setPasso("quem");
    else setPasso("valor");
  };

  const irParaValor = (d) => {
    setDestino(d);
    setDigitos("");
    setErro("");
    setPasso("valor");
  };

  const revisar = () => {
    if (valor <= 0) return setErro("Digite um valor maior que zero.");
    if (valor > saldo) return setErro(`Saldo insuficiente. Você tem R$ ${brl(saldo)} disponíveis.`);
    setErro("");
    setPasso("revisao");
  };

  const enviar = () => {
    const t = {
      data: HOJE,
      tipo: "saida",
      kind: "Pix enviado",
      nome: destino.nome,
      valor,
      cat: "Transferências",
    };
    registrar(t);
    setTela("extrato");
    setRecibo({ ...t, id: "novo", agora: true });
    avisar("Pix enviado.");
  };

  return (
    <>
      <Cabecalho titulo="Pix e transferir" aoVoltar={voltar} />

      {passo === "quem" && (
        <div className="b-corpo">
          <p className="b-saldo-rot">Disponível para transferir</p>
          <p className="b-saldo-med">
            {oculto ? <span className="b-oculto b-oculto-g" /> : <>R$ {brl(saldo)}</>}
          </p>

          <p className="b-rot-secao">Quem vai receber</p>
          <div className="b-cartao-branco">
            {CONTATOS.map((c, i) => (
              <button key={c.chave} className={"b-contato " + (i ? "b-borda-top" : "")} onClick={() => irParaValor(c)}>
                <span className="b-avatar">{c.nome.slice(0, 1)}</span>
                <span className="b-contato-txt">
                  <span className="b-contato-nome">{c.nome}</span>
                  <span className="b-contato-sub">{c.banco} · {c.chave}</span>
                </span>
                <Icone nome="seta" tam={18} larg={1.4} />
              </button>
            ))}
          </div>

          <p className="b-rot-secao">Ou use uma chave</p>
          <div className="b-cartao-branco b-pad">
            <input
              className="b-campo"
              value={chave}
              onChange={(e) => setChave(e.target.value)}
              placeholder="CPF, celular, e-mail ou chave aleatória"
            />
            <button
              className="b-btn"
              disabled={chave.trim().length < 5}
              onClick={() => irParaValor({ nome: chave.trim(), banco: "Chave Pix", chave: chave.trim() })}
            >
              Continuar
            </button>
          </div>
        </div>
      )}

      {passo === "valor" && (
        <div className="b-corpo b-corpo-alto">
          <p className="b-rot-secao b-sem-topo">Transferir para</p>
          <p className="b-destino">{destino.nome}</p>
          <p className="b-destino-sub">{destino.banco}</p>

          <div className="b-valor-cx">
            <span className="b-valor-moeda">R$</span>
            <span className={"b-valor-num " + (valor > 0 ? "" : "b-valor-zero")}>{brl(valor)}</span>
          </div>
          {erro ? (
            <p className="b-erro">{erro}</p>
          ) : (
            <p className="b-nota b-centro">Saldo depois da transferência: R$ {brl(Math.max(saldo - valor, 0))}</p>
          )}

          <Teclado
            onDigito={(d) => setDigitos((x) => (x + d).slice(0, 9))}
            onApagar={() => setDigitos((x) => x.slice(0, -1))}
          />
          <button className="b-btn b-btn-fixo" onClick={revisar}>Revisar transferência</button>
        </div>
      )}

      {passo === "revisao" && (
        <div className="b-corpo">
          <p className="b-rot-secao b-sem-topo">Confira antes de enviar</p>
          <div className="b-cartao-branco b-pad">
            <Campo r="Valor" v={`R$ ${brl(valor)}`} forte />
            <Campo r="Para" v={destino.nome} />
            <Campo r="Instituição" v={destino.banco} />
            <Campo r="Chave" v={destino.chave} />
            <Campo r="Quando" v={`Hoje, ${dataCurta(HOJE)}`} />
            <Campo r="Saldo após" v={`R$ ${brl(saldo - valor)}`} />
          </div>
          <button className="b-btn" onClick={enviar}>Enviar Pix</button>
          <button className="b-btn-vazio" onClick={() => setPasso("valor")}>Mudar valor</button>
        </div>
      )}
    </>
  );
}

function Campo({ r, v, forte }) {
  return (
    <div className="b-campo-linha">
      <span className="b-campo-r">{r}</span>
      <span className={"b-campo-v " + (forte ? "b-campo-forte" : "")}>{v}</span>
    </div>
  );
}

function Gastos({ setTela, lancs, oculto }) {
  const doMes = lancs.filter((t) => t.data.startsWith("2026-09"));
  const saidas = doMes.filter((t) => t.tipo === "saida");
  const entradas = doMes.filter((t) => t.tipo === "entrada");
  const totalSaidas = saidas.reduce((a, t) => a + t.valor, 0);
  const totalEntradas = entradas.reduce((a, t) => a + t.valor, 0);

  const cats = useMemo(() => {
    const m = {};
    saidas.forEach((t) => {
      m[t.cat] = (m[t.cat] || 0) + t.valor;
    });
    return Object.entries(m).sort((a, b) => b[1] - a[1]);
  }, [lancs]);

  const maior = cats.length ? cats[0][1] : 1;

  return (
    <>
      <Cabecalho titulo="Controle de Gastos" aoVoltar={() => setTela("extrato")} />
      <div className="b-corpo">
        <p className="b-rot-min">Saídas em setembro</p>
        <p className="b-saldo-num">
          {oculto ? <span className="b-oculto b-oculto-g" /> : <>R$ {brl(totalSaidas)}</>}
        </p>
        <p className="b-nota">
          Entradas no mesmo período: R$ {brl(totalEntradas)} · sobra de R$ {brl(totalEntradas - totalSaidas)}
        </p>

        <div className="b-cartao-branco b-pad b-mt">
          {cats.map(([nome, v]) => (
            <div key={nome} className="b-cat">
              <div className="b-cat-topo">
                <span className="b-cat-nome">
                  <span className="b-ponto" style={{ background: CORES_CAT[nome] || "#9A9A9A" }} />
                  {nome}
                </span>
                <span className="b-cat-val">
                  {oculto ? <span className="b-oculto b-oculto-p" /> : `R$ ${brl(v)}`}
                </span>
              </div>
              <div className="b-barra">
                <div
                  className="b-barra-preenche"
                  style={{ width: (v / maior) * 100 + "%", background: CORES_CAT[nome] || "#9A9A9A" }}
                />
              </div>
              <span className="b-nota">{Math.round((v / totalSaidas) * 100)}% das saídas</span>
            </div>
          ))}
        </div>

        <p className="b-rot-secao">Maiores saídas do mês</p>
        <div className="b-cartao-branco">
          {[...saidas].sort((a, b) => b.valor - a.valor).slice(0, 4).map((t, i) => (
            <div key={t.id} className={"b-fatura-linha " + (i ? "b-borda-top" : "")}>
              <span className="b-fatura-txt">
                <span className="b-lanc-nome b-forte">{t.nome}</span>
                <span className="b-nota">{t.cat} · {dataCurta(t.data)}</span>
              </span>
              <span className="b-forte">
                {oculto ? <span className="b-oculto b-oculto-p" /> : `R$ ${brl(t.valor)}`}
              </span>
            </div>
          ))}
        </div>
      </div>
    </>
  );
}

function Cofrinhos({ setTela, cofres, setCofres, saldo, setSaldo, oculto, registrar, avisar }) {
  const [aberto, setAberto] = useState(null); // {id, modo}
  const [txt, setTxt] = useState("");

  const cofre = cofres.find((c) => c.id === (aberto && aberto.id));
  const v = Number(txt.replace(/\D/g, "") || 0) / 100;

  const confirmar = () => {
    if (v <= 0) return;
    if (aberto.modo === "guardar") {
      if (v > saldo) return avisar(`Saldo insuficiente. Você tem R$ ${brl(saldo)}.`);
      setCofres((cs) => cs.map((c) => (c.id === cofre.id ? { ...c, saldo: c.saldo + v } : c)));
      registrar({ data: HOJE, tipo: "saida", kind: "Guardado no cofrinho", nome: cofre.nome, valor: v, cat: "Outros" });
      avisar("Guardado no cofrinho.");
    } else {
      if (v > cofre.saldo) return avisar(`Este cofrinho tem R$ ${brl(cofre.saldo)}.`);
      setCofres((cs) => cs.map((c) => (c.id === cofre.id ? { ...c, saldo: c.saldo - v } : c)));
      registrar({ data: HOJE, tipo: "entrada", kind: "Resgate do cofrinho", nome: cofre.nome, valor: v, cat: "Outros" });
      avisar("Resgatado para a conta.");
    }
    setAberto(null);
    setTxt("");
  };

  const total = cofres.reduce((a, c) => a + c.saldo, 0);

  return (
    <>
      <Cabecalho titulo="Cofrinhos" aoVoltar={() => setTela("extrato")} />
      <div className="b-corpo">
        <p className="b-rot-min">Total guardado</p>
        <p className="b-saldo-num">
          {oculto ? <span className="b-oculto b-oculto-g" /> : <>R$ {brl(total)}</>}
        </p>
        <p className="b-nota">Rende 100% do CDI e você resgata quando quiser.</p>

        {cofres.map((c) => {
          const pct = Math.min(Math.round((c.saldo / c.meta) * 100), 100);
          return (
            <div key={c.id} className="b-cartao-branco b-pad b-mt">
              <div className="b-cat-topo">
                <span className="b-cat-nome">
                  <span className="b-ponto" style={{ background: c.cor }} />
                  {c.nome}
                </span>
                <span className="b-forte">
                  {oculto ? <span className="b-oculto b-oculto-p" /> : `R$ ${brl(c.saldo)}`}
                </span>
              </div>
              <div className="b-barra">
                <div className="b-barra-preenche" style={{ width: pct + "%", background: c.cor }} />
              </div>
              <p className="b-nota">{pct}% da meta de R$ {brl(c.meta)}</p>
              <div className="b-duplo">
                <button className="b-btn b-btn-mini" onClick={() => { setAberto({ id: c.id, modo: "guardar" }); setTxt(""); }}>
                  <Icone nome="mais" tam={18} larg={2} /> Guardar
                </button>
                <button className="b-btn-vazio b-btn-mini" onClick={() => { setAberto({ id: c.id, modo: "resgatar" }); setTxt(""); }}>
                  <Icone nome="menos" tam={18} larg={2} /> Resgatar
                </button>
              </div>
            </div>
          );
        })}
      </div>

      {cofre && (
        <div className="b-modal" onClick={() => setAberto(null)}>
          <div className="b-folha" onClick={(e) => e.stopPropagation()}>
            <h2 className="b-folha-tit">
              {aberto.modo === "guardar" ? "Guardar em" : "Resgatar de"} {cofre.nome}
            </h2>
            <p className="b-folha-txt">
              {aberto.modo === "guardar"
                ? `Disponível na conta: R$ ${brl(saldo)}`
                : `Guardado neste cofrinho: R$ ${brl(cofre.saldo)}`}
            </p>
            <div className="b-valor-cx b-valor-cx-mini">
              <span className="b-valor-moeda">R$</span>
              <span className={"b-valor-num " + (v > 0 ? "" : "b-valor-zero")}>{brl(v)}</span>
            </div>
            <div className="b-rapidos">
              {[5000, 10000, 25000].map((c) => (
                <button key={c} className="b-rapido" onClick={() => setTxt(String(c))}>
                  R$ {brl(c / 100)}
                </button>
              ))}
            </div>
            <Teclado
              onDigito={(d) => setTxt((x) => (x + d).slice(0, 8))}
              onApagar={() => setTxt((x) => x.slice(0, -1))}
            />
            <button className="b-btn" onClick={confirmar}>
              {aberto.modo === "guardar" ? "Guardar" : "Resgatar"}
            </button>
          </div>
        </div>
      )}
    </>
  );
}

/* ------------------------------------------------------------------ */
/*  Comprovantes + recibo                                              */
/* ------------------------------------------------------------------ */

function Comprovantes({ setTela, lancs, oculto, setRecibo }) {
  const [filtro, setFiltro] = useState("todos");
  const lista = lancs.filter(
    (t) => t.data >= INICIO && (filtro === "todos" ? true : t.tipo === filtro)
  );

  return (
    <>
      <Cabecalho titulo="Comprovantes" aoVoltar={() => setTela("extrato")} />
      <div className="b-corpo">
        <p className="b-nota b-sem-topo">Toque em um lançamento para ver o comprovante.</p>
        <div className="b-filtros b-filtros-livres">
          <Filtro
            rotulo="Todos"
            valor={filtro}
            aoMudar={setFiltro}
            opcoes={[
              { v: "todos", r: "Todos" },
              { v: "entrada", r: "Recebidos" },
              { v: "saida", r: "Enviados" },
            ]}
          />
        </div>
        <div className="b-cartao-branco">
          {lista.map((t, i) => (
            <div key={t.id} className={i ? "b-borda-top" : ""}>
              <Linha t={t} oculto={oculto} aoAbrir={setRecibo} />
            </div>
          ))}
        </div>
      </div>
    </>
  );
}

function Recibo({ t, oculto, aoFechar, avisar }) {
  const id = useMemo(
    () => "E" + Math.abs(Math.floor(Math.random() * 9e11) + 1e11).toString(),
    [t]
  );
  return (
    <div className="b-modal" onClick={aoFechar}>
      <div className="b-folha b-folha-recibo" onClick={(e) => e.stopPropagation()}>
        <span className="b-selo">
          <Icone nome={t.tipo === "entrada" ? "entrada" : "check"} tam={26} larg={1.8} />
        </span>
        <h2 className="b-recibo-tit">{t.kind}</h2>
        <p className={"b-recibo-val " + (t.tipo === "entrada" ? "b-verde-txt" : "")}>
          {oculto ? <span className="b-oculto b-oculto-g" /> : <>R$ {brl(t.valor)}</>}
        </p>
        <div className="b-recibo-campos">
          <Campo r={t.tipo === "entrada" ? "De" : "Para"} v={t.nome} />
          <Campo r="Data" v={dataCurta(t.data)} />
          <Campo r="Conta" v="Ag 0341 · C/C 08471-2" />
          <Campo r="Identificador" v={id} />
        </div>
        <div className="b-duplo">
          <button className="b-btn b-btn-mini" onClick={() => avisar("Comprovante copiado.")}>
            <Icone nome="copiar" tam={18} larg={1.6} /> Copiar
          </button>
          <button className="b-btn-vazio b-btn-mini" onClick={() => avisar("Escolha um app para compartilhar.")}>
            <Icone nome="compartilhar" tam={18} larg={1.6} /> Compartilhar
          </button>
        </div>
        <button className="b-btn-texto" onClick={aoFechar}>Fechar</button>
      </div>
    </div>
  );
}
